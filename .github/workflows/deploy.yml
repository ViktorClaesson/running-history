# Builds the app and deploys it to GitHub Pages.
# Takes effect only once Settings → Pages → Source is set to "GitHub Actions" (until then
# Pages keeps serving the branch as before). See README, "Deploying".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # The site lives under /<repo>/, so assets, the manifest and the service worker scope
      # all need that prefix.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Keep the old single-file app at its old URL, so existing bookmarks still work.
      - run: cp legacy/running-history.html dist/running-history.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
